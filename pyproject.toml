[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-rag-assistant"
version = "0.1.0"
description = "A local-first, source-grounded assistant for personal documents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "pymupdf>=1.24,<2.0",
  "python-docx>=1.1,<2.0",\n  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<9.0", "ruff>=0.6,<1.0"]
embeddings = ["sentence-transformers>=3.0,<6.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
